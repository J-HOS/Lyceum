<title>Lyceum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A private, graduate-level tutor for any subject.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Lyceum: a reading-room for one student.
   Layout: sticky top bar, one centred column (1180px) that splits into text + sidebar on wide screens. */
:root {
  --paper: #f3f4f0;        /* cool, slightly green-tinged paper */
  --leaf: #fbfbf8;         /* raised surfaces */
  --leaf-2: #e7e9e2;       /* inset / hover */
  --ink: #1b2420;          /* body text, green-black */
  --ink-2: #4f5b55;
  --ink-3: #7f8a84;
  --rule: #d8dcd3;
  --green: #1d5a46;        /* library green: primary actions, progress */
  --green-ink: #f3f6f2;
  --green-soft: #dde9e2;
  --brass: #9a7224;        /* brass: eyebrows, numbering, highlights */
  --ok: #2c6a3f; --ok-soft: #e0eee3;
  --warn: #93600e; --warn-soft: #f4e9cf;
  --bad: #a23b2f; --bad-soft: #f6e1dd;
  --on-status: #ffffff;
  --shadow: 0 1px 2px rgba(20, 35, 28, .05), 0 8px 24px -14px rgba(20, 35, 28, .22);
  --read: 'Spectral', 'Iowan Old Style', Georgia, serif;
  --ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111614; --leaf: #18201c; --leaf-2: #222b26; --ink: #e4e9e4; --ink-2: #a8b3ac; --ink-3: #75817a;
    --rule: #2c3631; --green: #6fbf9a; --green-ink: #0d1612; --green-soft: #1e3329; --brass: #d4ad5c;
    --ok: #7cc495; --ok-soft: #1b2e22; --warn: #e2b766; --warn-soft: #33291a; --bad: #ec8a80; --bad-soft: #3a211e;
    --on-status: #0d1612;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111614; --leaf: #18201c; --leaf-2: #222b26; --ink: #e4e9e4; --ink-2: #a8b3ac; --ink-3: #75817a;
  --rule: #2c3631; --green: #6fbf9a; --green-ink: #0d1612; --green-soft: #1e3329; --brass: #d4ad5c;
  --ok: #7cc495; --ok-soft: #1b2e22; --warn: #e2b766; --warn-soft: #33291a; --bad: #ec8a80; --bad-soft: #3a211e;
  --on-status: #0d1612;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.65);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: var(--green); text-decoration-thickness: 1px; text-underline-offset: 2px; }
h1, h2, h3 { font-family: var(--read); font-weight: 600; line-height: 1.18; margin: 0; letter-spacing: -.005em; text-wrap: balance; }
h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 500; }
h2 { font-size: 22px; font-weight: 500; }
h3 { font-size: 17px; }
code { font: .88em var(--mono); background: var(--leaf-2); padding: 1px 5px; border-radius: 4px; }
kbd { font: 11px var(--mono); border: 1px solid currentColor; opacity: .6; padding: 0 4px; border-radius: 4px; margin-left: 8px; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; margin: 6px 2px 0; color: var(--ink-3); }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font: 600 11.5px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--brass); margin: 0 0 6px; }
.req { color: var(--bad); }

/* layout */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 1180px) / 2)); padding-right: max(16px, env(safe-area-inset-right, 0px), calc((100vw - 1180px) / 2));
  background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 9px; font: 600 21px var(--read); color: var(--ink); text-decoration: none; letter-spacing: .01em; }
.brand svg { width: 24px; height: 24px; fill: var(--green); }
.nav { display: flex; gap: 2px; }
.nav a { color: var(--ink-2); text-decoration: none; padding: 7px 12px; border-radius: 8px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.nav a:hover { background: var(--leaf-2); color: var(--ink); }
.nav a.active { color: var(--ink); background: var(--leaf-2); }
.badge { background: var(--brass); color: var(--paper); font: 600 11px var(--mono); border-radius: 99px; padding: 0 7px; line-height: 18px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.crumb { display: inline-block; color: var(--ink-2); text-decoration: none; font-size: 13.5px; margin-bottom: 14px; }
.crumb:hover { color: var(--green); }
.panel { background: var(--leaf); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px 20px; }
.panel h3 { margin-bottom: 10px; }
.panel.quiet { background: transparent; border-style: dashed; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.panel.quiet p { margin: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row-between { display: flex; justify-content: space-between; align-items: baseline; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
.banner { background: var(--green-soft); border: 1px solid color-mix(in srgb, var(--green) 30%, transparent); padding: 12px 16px; border-radius: var(--r); margin-bottom: 22px; }
.banner.soft { background: transparent; border-style: dashed; color: var(--ink-2); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 500 14px var(--ui); color: var(--ink);
  background: var(--leaf); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 15px; cursor: pointer; text-decoration: none;
  transition: background .15s, border-color .15s, transform .05s; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--on-status); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--leaf-2); }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn.block { width: 100%; justify-content: flex-start; margin-bottom: 8px; }
.btn.wide { min-width: min(240px, 100%); }
.link-btn { background: none; border: 0; color: var(--green); cursor: pointer; font: 500 13px var(--ui); padding: 0; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.pill { display: inline-block; font-size: 12.5px; font-weight: 500; padding: 3px 10px; border-radius: 99px; background: var(--leaf-2); color: var(--ink-2); }
.pill.done { background: var(--ok-soft); color: var(--ok); }

/* forms */
.form { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
.form h2 { font-size: 20px; }
.form p { margin: 0; }
.form > label { font-weight: 500; font-size: 14px; margin-top: 6px; }
input:not([type=radio]):not([type=checkbox]), textarea, select {
  font: 15px/1.5 var(--ui); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; width: 100%; }
textarea { resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--green) 45%, transparent); outline-offset: 1px; border-color: var(--green); }
.keyrow { display: flex; gap: 8px; }
.keyrow input { flex: 1; font-family: var(--mono); font-size: 14px; }
.seg { border: 0; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.seg legend { font-weight: 500; font-size: 14px; margin-bottom: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 8px; padding: 11px 13px; cursor: pointer; background: var(--paper); font-weight: 600; }
.seg small { font-weight: 400; color: var(--ink-2); font-size: 12.5px; }
.seg input:checked + span { border-color: var(--green); background: var(--green-soft); }
.seg input:focus-visible + span { outline: 2px solid var(--green); }
.check { display: flex; align-items: center; gap: 8px; margin-top: 14px; cursor: pointer; font-weight: 500; }
.check input { width: 17px; height: 17px; accent-color: var(--green); }
.settings { display: flex; flex-direction: column; gap: 18px; }
.settings .actions.sticky { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); margin: 0; }

/* home */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 26px; }
.stat { border-top: 2px solid var(--ink); padding: 10px 2px 0; display: flex; flex-direction: column; color: var(--ink-2); text-decoration: none; font-size: 13px; }
.stat .num { font: 500 30px var(--mono); color: var(--ink); line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat.link { border-top-color: var(--brass); }
.stat.link:hover .num { color: var(--brass); }
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 16px; }
.course-card { background: var(--leaf); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.course-card .cover { padding: 20px 20px 14px; text-decoration: none; color: inherit; flex: 1; }
.course-card .cover:hover h3 { color: var(--green); }
.course-card h3 { font-size: 21px; font-weight: 500; margin-bottom: 8px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 0; font-size: 14px; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 20px 16px; font-size: 13px; flex-wrap: wrap; }
.progress { height: 4px; background: var(--leaf-2); margin: 0 20px; border-radius: 4px; overflow: hidden; }
.progress div { height: 100%; background: var(--green); border-radius: 4px; }
.progress.big { height: 6px; margin: 18px 0 8px; max-width: 520px; }
.empty { text-align: center; padding: 48px 0; max-width: 560px; margin: 0 auto; }
.empty h2 { margin-bottom: 8px; }
.empty p { margin: 0 0 20px; }
.examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 22px; }
.loading-card { display: flex; gap: 12px; align-items: center; color: var(--ink-2); padding: 40px 0; justify-content: center; text-align: center; }

/* course */
.course-head { margin-bottom: 30px; max-width: 820px; }
.lede { font: 19px/1.55 var(--read); color: var(--ink-2); margin: 12px 0 0; max-width: 65ch; }
.course-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.modules { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.module { background: var(--leaf); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px; }
.module-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.module-head p.muted { margin: 6px 0 0; font-size: 14px; }
.module-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.lessons { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.lesson-row { display: grid; grid-template-columns: 14px 40px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 11px 6px; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.lessons li:last-child .lesson-row { border-bottom: 0; }
.lesson-row:hover { background: var(--leaf-2); }
.lesson-row .ln { color: var(--brass); font-size: 13px; }
.lesson-row .lt { font-family: var(--read); font-size: 17px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-3); }
.in-progress .dot { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
.done .dot { border-color: var(--ok); background: var(--ok); }
.course-aside { display: flex; flex-direction: column; gap: 14px; position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
.course-aside ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
.course-aside li { margin-bottom: 6px; }
.texts li { font-family: var(--read); font-style: italic; font-size: 15px; }

/* lesson */
.lesson-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; }
.lesson-head { margin-bottom: 20px; max-width: 820px; }
.lesson-main { min-width: 0; }
.chat { display: flex; flex-direction: column; gap: 22px; }
.msg { min-width: 0; }
.msg .who { font: 600 11px var(--ui); text-transform: uppercase; letter-spacing: .1em; color: var(--brass); margin-bottom: 6px; }
.msg.assistant .prose { font: 18.5px/1.68 var(--read); max-width: 68ch; }
.msg.user { align-self: flex-end; max-width: 85%; background: var(--leaf-2); border-radius: 14px 14px 4px 14px; padding: 12px 16px; }
.msg.user .who { display: none; }
.msg.error { background: var(--bad-soft); color: var(--bad); border-radius: var(--r); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.msg.error p { margin: 0; }
.sys-note { text-align: center; font: 500 11px var(--ui); color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; }
.sys-note::before, .sys-note::after { content: '·'; margin: 0 10px; }
.start-card { background: var(--leaf); border: 1px solid var(--rule); border-radius: var(--r); padding: 24px; }
.start-card p { margin: 0 0 16px; font: 18px/1.6 var(--read); color: var(--ink-2); max-width: 62ch; }
.composer { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: linear-gradient(to bottom, transparent, var(--paper) 18px); padding: 26px 0 14px; margin-top: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { font: 500 12.5px var(--ui); background: var(--leaf); border: 1px solid var(--rule); color: var(--ink-2); padding: 5px 11px; border-radius: 99px; cursor: pointer; text-decoration: none; }
.chip:hover { border-color: var(--green); color: var(--green); }
.ask { display: flex; gap: 8px; align-items: flex-end; background: var(--leaf); border: 1px solid var(--rule); border-radius: 12px; padding: 8px; box-shadow: var(--shadow); }
.ask textarea { border: 0; background: transparent; padding: 8px; min-height: 44px; max-height: 260px; }
.ask textarea:focus { outline: none; }
.lesson-aside { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 92px); overflow: auto; padding-bottom: 8px; }
.objectives { margin: 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
.objectives li { margin-bottom: 6px; }
.tools .btn:last-child { margin-bottom: 0; }
.notes { font-size: 14px; }
.notes.collapsed { max-height: 180px; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent); mask-image: linear-gradient(to bottom, #000 60%, transparent); }
.notes h2 { font-size: 17px; margin-top: 14px; }
.notes h3 { font-size: 15px; }
.pager { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.pager a { text-decoration: none; }
.thinking { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-3); font: 14px var(--ui); }
.typing { display: inline-flex; gap: 4px; padding: 6px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* prose */
.prose { overflow-wrap: break-word; }
.prose > :first-child { margin-top: 0; }
.prose > :last-child { margin-bottom: 0; }
.prose p, .prose ul, .prose ol, .prose blockquote, .prose pre, .prose table { margin: 0 0 .8em; }
.prose h1, .prose h2, .prose h3, .prose h4 { margin: 1.2em 0 .4em; }
.prose h3 { font-size: 1.1em; }
.prose li { margin-bottom: .25em; }
.prose blockquote { border-left: 3px solid var(--brass); padding: 2px 0 2px 14px; color: var(--ink-2); }
.prose pre { background: var(--leaf-2); padding: 12px 14px; border-radius: 8px; overflow-x: auto; font-size: 13.5px; }
.prose pre code { background: none; padding: 0; }
.prose table { border-collapse: collapse; display: block; overflow-x: auto; font-family: var(--ui); font-size: 14px; }
.prose th, .prose td { border: 1px solid var(--rule); padding: 6px 10px; text-align: left; }
.prose math[display="block"] { display: block; overflow-x: auto; overflow-y: hidden; padding: 6px 0; margin: .4em 0; }
.prose math { font-size: 1.05em; }
.prose hr { border: 0; border-top: 1px solid var(--rule); margin: 1.4em 0; }

/* quiz */
.quiz { display: flex; flex-direction: column; gap: 16px; max-width: 820px; }
.q { margin: 0; min-width: 0; }
.q legend { display: flex; align-items: center; gap: 10px; font: 600 11px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 0; float: left; width: 100%; margin-bottom: 10px; }
.q legend + * { clear: both; }
.qn { font-size: 14px; color: var(--brass); letter-spacing: 0; }
.q > .prose { font: 17.5px/1.55 var(--read); margin-bottom: 14px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.opt:hover { border-color: var(--ink-3); }
.opt input { margin-top: 4px; accent-color: var(--green); }
.opt:has(input:checked) { border-color: var(--green); background: var(--green-soft); }
.opt.correct, .opt.correct:has(input:checked) { border-color: var(--ok); background: var(--ok-soft); }
.opt.chosen-wrong, .opt.chosen-wrong:has(input:checked) { border-color: var(--bad); background: var(--bad-soft); }
.q.right { border-left: 4px solid var(--ok); }
.q.partial { border-left: 4px solid var(--warn); }
.q.wrong { border-left: 4px solid var(--bad); }
.result { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 14.5px; }
.verdict { font-weight: 600; margin: 0 0 8px; }
.right .verdict { color: var(--ok); }
.partial .verdict { color: var(--warn); }
.wrong .verdict { color: var(--bad); }
.result details { margin: 10px 0; }
.result summary { cursor: pointer; color: var(--green); font-weight: 500; }
.explain { color: var(--ink-2); margin-top: 8px; }
.big-score { font-size: 56px; line-height: 1; margin: 4px 0 8px; }
.score-card p { margin: 0; }

/* review */
.flashcard { max-width: 720px; margin: 10px auto 18px; min-height: 260px; display: flex; flex-direction: column; justify-content: center; padding: 34px 38px; box-shadow: var(--shadow); }
.flashcard .front { font: 21px/1.5 var(--read); }
.flashcard .back { border-top: 1px solid var(--rule); margin-top: 22px; padding-top: 20px; font: 17.5px/1.6 var(--read); }
.review-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.grade { flex-direction: column; gap: 0; min-width: 96px; padding: 9px 14px; }
.grade small { font: 12px var(--mono); color: var(--ink-3); }
.g1 { border-color: color-mix(in srgb, var(--bad) 45%, var(--rule)); }
.g3 { border-color: color-mix(in srgb, var(--ok) 45%, var(--rule)); }

/* a moment in history */

          <div class="result" hidden></div>
        </fieldset>`
    ).join("")}
    <div class="actions"><button class="btn primary" type="submit">Submit for grading</button></div>
  </form>`;
    document.getElementById("qf").onsubmit = (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector("button[type=submit]");
      withBusy(btn, "Grading\u2026", async () => {
        var _a, _b;
        const fd = new FormData(form);
        const scores = {};
        const written = [];
        for (const q of qs) {
          const v = fd.get(`q${q.id}`);
          if (q.type === "mcq") scores[q.id] = { score: v != null && Number(v) === q.answer_index ? 1 : 0, chosen: v == null ? null : Number(v) };
          else written.push({ id: q.id, prompt: q.prompt, model_answer: q.model_answer, answer: (v || "").trim() });
        }
        written.filter((w) => !w.answer).forEach((w) => scores[w.id] = { score: 0, feedback: "No answer given." });
        const needGrading = written.filter((w) => w.answer);
        if (needGrading.length) {
          const g = await json({ instructions: GRADE_SYSTEM, prompt: gradeRequest(needGrading), schema: GRADE_TOOL.input_schema });
          for (const r of g.grades || []) scores[r.id] = { score: Math.max(0, Math.min(1, Number(r.score) || 0)), feedback: String(r.feedback || "") };
        }
        let total = 0;
        for (const q of qs) {
          const sc = scores[q.id] || { score: 0 };
          total += sc.score;
          const fs = form.querySelector(`[data-id="${q.id}"]`);
          fs.classList.add(sc.score >= 0.75 ? "right" : sc.score > 0 ? "partial" : "wrong");
          fs.querySelectorAll("input,textarea").forEach((x) => x.disabled = true);
          if (q.type === "mcq") {
            fs.querySelectorAll(".opt").forEach((o, k) => {
              if (k === q.answer_index) o.classList.add("correct");
              else if (k === sc.chosen) o.classList.add("chosen-wrong");
            });
          }
          const res = fs.querySelector(".result");
          res.hidden = false;
          res.innerHTML = `
          <p class="verdict">${q.type === "mcq" ? sc.score ? "Correct" : "Incorrect" : `Score: ${Math.round(sc.score * 100)}%`}</p>
          ${sc.feedback ? `<div class="prose">${md(sc.feedback)}</div>` : ""}
          ${q.type === "written" ? `<details><summary>Model answer</summary><div class="prose">${md(q.model_answer || "")}</div></details>` : ""}
          <div class="prose explain">${md(q.explanation || "")}</div>`;
        }
        const score = total / qs.length;
        const entry = { date: today2(), score };
        if (kind2 === "module") ((_a = c.modules[mi]).examHistory || (_a.examHistory = [])).push(entry);
        else ((_b = c.modules[mi].lessons[li]).quizHistory || (_b.quizHistory = [])).push(entry);
        await saveCourse(c);
        const missed = qs.filter((q) => (scores[q.id]?.score ?? 0) < 0.75);
        btn.closest(".actions").innerHTML = "";
        const sum = document.createElement("div");
        sum.className = "panel score-card";
        sum.innerHTML = `<p class="eyebrow">Result</p><p class="big-score mono">${Math.round(score * 100)}%</p>
        <p class="muted">${score >= 0.85 ? "Excellent command of the material." : score >= 0.65 ? "Solid, with gaps worth revisiting." : "Worth another pass before moving on. Ask your tutor about the questions you missed."}</p>
        <div class="actions">
          ${missed.length ? `<button class="btn primary" id="miss">Turn ${missed.length} missed question${missed.length > 1 ? "s" : ""} into flashcards</button>` : ""}
          <a class="btn" href="${back}">Done</a>
        </div>`;
        box.prepend(sum);
        window.scrollTo({ top: 0, behavior: "smooth" });
        const mb = document.getElementById("miss");
        if (mb)
          mb.onclick = async () => {
            const now = Date.now();
            const lessonId = kind2 === "module" ? null : targetId;
            await putMany("cards", missed.map((q) => ({
              id: uid(),
              courseId: cid,
              lessonId,
              front: q.prompt + (q.type === "mcq" ? "\n\n" + q.options.map((o, k) => `${"ABCDEF"[k]}. ${o}`).join("\n") : ""),
              back: (q.type === "mcq" ? `**${"ABCDEF"[q.answer_index]}. ${q.options[q.answer_index]}**

` : `${q.model_answer || ""}

`) + (q.explanation || ""),
              ease: 2.5,
              interval: 0,
              reps: 0,
              due: now,
              created: now
            })));
            mb.disabled = true;
            mb.textContent = "Added to your review queue";
            updateNavBadge();
          };
      });
    };
  }
  function schedule(card2, grade) {
    let { ease = 2.5, interval = 0, reps = 0 } = card2;
    const q = { 1: 1, 2: 3, 3: 4, 4: 5 }[grade];
    let due;
    if (q < 3) {
      reps = 0;
      interval = 0;
      due = Date.now() + 10 * 60 * 1e3;
    } else {
      reps += 1;
      if (reps === 1) interval = q === 5 ? 3 : 1;
      else if (reps === 2) interval = q === 3 ? 3 : 6;
      else interval = Math.max(interval + 1, Math.round(interval * ease * (q === 3 ? 0.8 : q === 5 ? 1.3 : 1)));
      due = Date.now() + interval * 864e5;
    }
    ease = Math.max(1.3, ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
    return { ...card2, ease, interval, reps, due, lastReviewed: Date.now() };
  }
  async function reviewPage(courseId) {
    const [cards, courses] = await Promise.all([all("cards"), all("courses")]);
    const titles = { "history-moments": "A moment in history", ...Object.fromEntries(courses.map((c) => [c.id, c.title])) };
    const queue = cards.filter((c) => c.due <= Date.now() && (!courseId || c.courseId === courseId)).sort((a, b) => a.due - b.due);
    let reviewed = 0;
    let grading = false;
    const header = `<header class="page-head"><div><p class="eyebrow">Spaced repetition</p><h1>Review${courseId && titles[courseId] ? `: ${h(titles[courseId])}` : ""}</h1></div>
    ${courseId ? `<a class="btn ghost" href="#/review">All courses</a>` : ""}</header>`;
    function show() {
      if (!queue.length) {
        const upcoming = cards.filter((c) => c.due > Date.now() && (!courseId || c.courseId === courseId)).sort((a, b) => a.due - b.due)[0];
        view.innerHTML = `${header}<div class="empty"><h2>${reviewed ? `Done: ${reviewed} card${reviewed > 1 ? "s" : ""} reviewed` : "Nothing due right now"}</h2>
        <p class="muted">${upcoming ? `Next card is due ${new Date(upcoming.due).toLocaleString()}.` : "Make flashcards from any lesson to start building long-term memory."}</p>
        <a class="btn" href="#/">Back to courses</a></div>`;
        updateNavBadge();
        return;
      }
      const card2 = queue[0];
      view.innerHTML = `${header}
      <p class="muted small center mono">${queue.length} due \xB7 ${h(titles[card2.courseId] || "")}</p>
      <div class="flashcard panel" id="fc">
        <div class="prose front">${md(card2.front)}</div>
        <div class="prose back" hidden>${md(card2.back)}</div>
      </div>
      <div class="review-actions" id="ra">
        <button class="btn primary wide" id="reveal">Show answer <kbd>Space</kbd></button>
      </div>`;
      document.getElementById("reveal").onclick = reveal;
    }
    function reveal() {
      const back = document.querySelector("#fc .back");
      if (!back || !back.hidden) return;
      back.hidden = false;
      document.getElementById("ra").innerHTML = [[1, "Again"], [2, "Hard"], [3, "Good"], [4, "Easy"]].map(([g, label]) => {
        const next = schedule(queue[0], g);
        const d = Math.round((next.due - Date.now()) / 864e5);
        const when = g === 1 ? "10 min" : d <= 1 ? "1 day" : `${d} days`;
        return `<button class="btn grade g${g}" data-g="${g}">${label}<small>${when}</small></button>`;
      }).join("");
      document.querySelectorAll(".grade").forEach((b) => b.onclick = () => grade(+b.dataset.g));
    }
    async function grade(g) {
      const back = document.querySelector("#fc .back");
      if (grading || !queue.length || !back || back.hidden) return;
      grading = true;
      const card2 = queue.shift();
      const updated = schedule(card2, g);
      try {
        await put("cards", updated);
      } catch (e) {
        toast(e.message, "err");
      }
      reviewed++;
      if (g === 1) queue.push(updated);
      grading = false;
      show();
    }
    const onKey = (e) => {
      if (!currentPath.startsWith("review")) return document.removeEventListener("keydown", onKey);
      if (e.target.matches("input,textarea")) return;
      if (e.code === "Space") {
        e.preventDefault();
        reveal();
      }
      if (["1", "2", "3", "4"].includes(e.key) && document.querySelector(".grade")) grade(+e.key);
    };
    document.addEventListener("keydown", onKey);
    show();
  }

    const form = document.getElementById("sf");
